{% extends "base.html" %}

{% block content %}

<section class="hero">
  <div class="container hero__content">

    <div class="hero__text">
      <p class="section-label">🌿 Colombia te espera</p>

      <h1 class="hero__title text-display">
        Viaja, explora y <em class="gradient-text">vive Colombia</em>
      </h1>

      <p class="hero__desc">
        Descubre los mejores destinos con MAREVA.
      </p>

      <form class="search-bar" onsubmit="return buscarPaquete(event)">
        <input type="text" id="searchInput" class="search-bar__input" placeholder="Buscar destino o paquete...">
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>

    </div>

  </div>
</section>

<section class="stats-bar">
  <div class="container">
    <ul class="stats-bar__list">
      <li><strong>20+</strong> Destinos</li>
      <li><strong>5</strong> Niveles</li>
      <li><strong>100%</strong> Seguro</li>
      <li><strong>24/7</strong> Soporte</li>
    </ul>
  </div>
</section>

<section class="section" id="paquetes">

  <div class="container">

    <div class="section-header">
      <p class="section-label">✨ Destacados</p>
      <h2 class="section-title">Paquetes populares</h2>
    </div>

    <div class="filtros">
      <button class="filtro-btn active" onclick="filtrarPaquetes('todos')">Todos</button>
      <button class="filtro-btn" onclick="filtrarPaquetes('aventura')">Aventura</button>
      <button class="filtro-btn" onclick="filtrarPaquetes('cultural')">Cultural</button>
      <button class="filtro-btn" onclick="filtrarPaquetes('ecoturismo')">Ecoturismo</button>
      <button class="filtro-btn" onclick="filtrarPaquetes('playa')">Playa</button>
    </div>

    

  </div>

</section>

{% endblock %}
