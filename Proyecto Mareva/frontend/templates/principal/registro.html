{% extends "base.html" %}

{% block content %}

<main class="auth-main">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg__blob auth-bg__blob--1"></div>
    <div class="auth-bg__blob auth-bg__blob--2"></div>
  </div>

  <div class="registro-layout">
    <div class="auth-card__header" style="margin-bottom:var(--space-6)">
      <h1 class="auth-card__title text-display">Crear cuenta</h1>
      <p class="auth-card__subtitle">Únete a MAREVA y empieza a explorar Colombia</p>
    </div>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('auth.funcion_registro') }}">
      <div class="grid-2" style="gap:var(--space-4);margin-bottom:var(--space-4)">

        <div class="form-group">
          <label class="form-label">Nombres <span class="form-required">*</span></label>
          <input type="text" name="nombre" class="form-input" placeholder="Tu nombre" required>
        </div>
        <div class="form-group">
          <label class="form-label">Apellidos <span class="form-required">*</span></label>
          <input type="text" name="apellido" class="form-input" placeholder="Tu apellido" required>
        </div>
      </div>

      <div class="grid-2" style="gap:var(--space-4);margin-bottom:var(--space-4)">
        <div class="form-group">
          <label class="form-label">Tipo de documento <span class="form-required">*</span></label>
          <select name="tipo" class="form-input" required>
            <option value="" disabled selected>Seleccione</option>
            <option value="CC">Cédula de ciudadanía</option>
            <option value="TI">Tarjeta de identidad</option>
            <option value="CE">Cédula de extranjería</option>
            <option value="PA">Pasaporte</option>
            <option value="PEP">PEP</option>
            <option value="PPT">PPT</option>
            <option value="RC">Registro civil</option>
          </select>

        </div>
        <div class="form-group">
          <label class="form-label">Numero de documento <span class="form-required">*</span></label>
          <input type="text" name="numero" class="form-input" placeholder="Numero de documento" required>
        </div>
      </div>

      <div class="grid-2" style="gap:var(--space-4);margin-bottom:var(--space-4)">
        <div class="form-group">
        <label class="form-label">Teléfono <span class="form-required">*</span></label>
        <input type="tel" id="telefono" class="form-input" placeholder="Número de teléfono" required>
        <input type="hidden" id="telefono_completo" name="telefono">
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">Codico de referido</label>
        <input type="email" name="codigo" class="form-input" placeholder="Codigo de referido">
      </div>

      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">Correo electrónico <span class="form-required">*</span></label>
        <input type="email" name="correo" class="form-input" placeholder="tu@correo.com" required>
      </div>

        <div class="form-group">
          <label class="form-label">Contraseña <span class="form-required">*</span></label>
          <input type="password" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required>


      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">
        Crear cuenta ✈
      </button>
    </form>

    <p class="auth-card__footer">
      ¿Ya tienes cuenta? <a href="{{ url_for('auth.mostrar_login') }}" class="form-link">Inicia sesión</a>
    </p>
  </div>
</main>
<script src="{{ url_for('static', filename='js/registro.js') }}"></script>
{% endblock %}
