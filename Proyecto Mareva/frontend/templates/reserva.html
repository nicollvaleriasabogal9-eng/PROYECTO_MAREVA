<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <a href="javascript:history.back()" class="btn btn-ghost btn-sm" style="margin-bottom:var(--space-4)">← Volver</a>
  <title>Reservar – {{ paquete.nombre }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<header>
  <nav class="navbar">
    <div class="container navbar__inner">
      <!-- LOGO -->
      <a href="{{ url_for('inicio') }}" class="navbar__logo" aria-label="MAREVA – volver al inicio">
        <img src="{{ url_for('static', filename='img/logo.jpeg') }}"
             alt="Logo MAREVA"
             class="navbar__logo-img"
             style="height: 32px; width: auto;">
        MAREVA
      </a>
    </div>
  </nav>
</header>

<main class="section">
  <div class="container" style="max-width:720px">
    <p class="section-label">📋 Formulario de reserva</p>
    <h1 class="section-title">{{ paquete.nombre }}</h1>
    <p class="section-desc">{{ paquete.descripcion }}</p>

    <div class="divider"></div>

    <form method="POST" action="{{ url_for('confirmar_reserva') }}">
      <input type="hidden" name="paquete" value="{{ paquete.slug }}">

      <h2 style="margin-bottom:var(--space-4);font-size:var(--text-xl)">👥 Viajeros</h2>
      <div class="grid-3" style="margin-bottom:var(--space-6)">
        <div class="form-group">
          <label class="form-label">Adultos</label>
          <input type="number" name="adultos" class="form-input" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Menores (2–17 años)</label>
          <input type="number" name="menores" class="form-input" min="0" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">Bebés (0–2 años)</label>
          <input type="number" name="bebes" class="form-input" min="0" value="0">
        </div>
      </div>

      <div class="form-group" style="margin-bottom:var(--space-6)">
        <label class="form-label">¿Viaja con mascotas?</label>
        <select name="mascotas" class="form-select">
          <option value="no">No</option>
          <option value="si">Sí</option>
        </select>
      </div>

      <h2 style="margin-bottom:var(--space-4);font-size:var(--text-xl)">📅 Fechas</h2>
      <div class="grid-2" style="margin-bottom:var(--space-6)">
        <div class="form-group">
          <label class="form-label">Fecha de inicio</label>
          <input type="date" name="fecha_inicio" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Días de estancia</label>
          <input type="number" name="dias" class="form-input" min="1" value="{{ paquete.duracion_dias }}">
        </div>
      </div>

      <h2 style="margin-bottom:var(--space-4);font-size:var(--text-xl)">🧳 ¿Qué incluye tu viaje?</h2>
      <div class="form-group" style="margin-bottom:var(--space-6)">
        <label class="form-label">Selecciona tu plan</label>
        <select name="plan" class="form-select">
          <option value="completo">Paquete completo (todo incluido)</option>
          <option value="solo_alojamiento">Solo alojamiento</option>
          <option value="solo_vuelos">Solo vuelos</option>
          <option value="solo_alimentacion">Solo alimentación</option>
          <option value="personalizado">Personalizado</option>
        </select>
      </div>

      {% if paquete.servicios_extra %}
      <h2 style="margin-bottom:var(--space-4);font-size:var(--text-xl)">✨ Servicios extra</h2>
      <div style="display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-6)">
        {% for s in paquete.servicios_extra %}
        <label class="filtro-check" style="background:var(--white);border:1px solid var(--gray-200);padding:var(--space-3);border-radius:var(--radius-md)">
          <input type="checkbox" name="extras" value="{{ s.nombre }}">
          <span>{{ s.nombre }} — <strong>${{ "{:,.0f}".format(s.precio) }}</strong></span>
        </label>
        {% endfor %}
      </div>
      {% endif %}

      <div class="form-group" style="margin-bottom:var(--space-8)">
        <label class="form-label">Notas o solicitudes especiales</label>
        <textarea name="notas" class="form-textarea" rows="3" placeholder="Alergias, preferencias, celebraciones..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">
        Guardar reserva ✈
      </button>
    </form>
  </div>
</main>
</body>
</html>
