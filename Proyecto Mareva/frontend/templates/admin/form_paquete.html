{% extends "base.html" %}

{% block content %}

<main>

<section class="page-hero">
  <div class="container">
    {% if paquete %}
      <h1>✏️ Editar Paquete: {{ paquete.nombre }}</h1>
    {% else %}
      <h1>➕ Crear Nuevo Paquete</h1>
    {% endif %}
  </div>
</section>

<div class="container" style="max-width: 700px; margin: 40px auto; margin-bottom: 80px;">

  {% if error %}
    <div style="background: #ffebee; border: 1px solid #f44336; color: #c62828; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
      ⚠️ {{ error }}
    </div>
  {% endif %}

  <form method="POST" style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    
    
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Nombre del paquete *</strong></label>
      <input 
        type="text" 
        name="nombre" 
        value="{{ paquete.nombre if paquete else '' }}" 
        required 
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
    </div>

    
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Emoji 🎯</strong></label>
      <input 
        type="text" 
        name="emoji" 
        maxlength="2" 
        value="{{ paquete.emoji if paquete else '🧳' }}" 
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1.5em;">
    </div>

 
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Descripción *</strong></label>
      <textarea 
        name="descripcion" 
        rows="4" 
        required 
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em; resize: vertical;">{{ paquete.descripcion if paquete else '' }}</textarea>
    </div>


    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Destino *</strong></label>
      <select 
        name="id_destino" 
        required 
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
        <option value="">-- Selecciona un destino --</option>
        {% for destino in destinos %}
          <option 
            value="{{ destino.id_destino }}"
            {% if paquete and paquete.id_destino == destino.id_destino %}selected{% endif %}>
            {{ destino.nombre_destino }} ({{ destino.departamento }})
          </option>
        {% endfor %}
      </select>
    </div>


    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Precio (COP) *</strong></label>
      <input 
        type="number" 
        name="precio" 
        value="{{ paquete.precio if paquete else '' }}" 
        required 
        step="1000"
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
    </div>


    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
      <div>
        <label style="display: block; margin-bottom: 5px;"><strong>Días *</strong></label>
        <input 
          type="number" 
          name="duracion_dias" 
          value="{{ paquete.duracion_dias if paquete else '' }}" 
          required 
          min="1"
          style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
      </div>
      <div>
        <label style="display: block; margin-bottom: 5px;"><strong>Noches *</strong></label>
        <input 
          type="number" 
          name="duracion_noches" 
          value="{{ paquete.duracion_noches if paquete else '' }}" 
          required 
          min="0"
          style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
      </div>
    </div>


    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Cupos Totales *</strong></label>
      <input 
        type="number" 
        name="cupos_totales" 
        value="{{ paquete.cupos_totales if paquete else '' }}" 
        required 
        min="1"
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
      <div>
        <label style="display: block; margin-bottom: 5px;"><strong>Fecha Inicio</strong></label>
        <input 
          type="date" 
          name="fecha_inicio" 
          value="{{ paquete.fecha_inicio if paquete and paquete.fecha_inicio else '' }}"
          style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
      </div>
      <div>
        <label style="display: block; margin-bottom: 5px;"><strong>Fecha Fin</strong></label>
        <input 
          type="date" 
          name="fecha_fin" 
          value="{{ paquete.fecha_fin if paquete and paquete.fecha_fin else '' }}"
          style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
      </div>
    </div>

    <div style="margin-bottom: 30px;">
      <label style="display: block; margin-bottom: 5px;"><strong>Guía Asignada (Opcional)</strong></label>
      <select 
        name="id_guia" 
        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 1em;">
        <option value="">-- Sin guía asignada --</option>
        {% for guia in guias %}
          <option 
            value="{{ guia.id_guia }}"
            {% if paquete and paquete.id_guia == guia.id_guia %}selected{% endif %}>
            {{ guia.nombre_guia }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div style="display: flex; gap: 10px; justify-content: space-between;">
      <div style="display: flex; gap: 10px;">
        {% if paquete %}
          <button type="submit" class="btn btn-primary btn-lg">💾 Guardar cambios</button>
        {% else %}
          <button type="submit" class="btn btn-primary btn-lg">➕ Crear paquete</button>
        {% endif %}
        <a href="{{ url_for('paquetes.panel_admin') }}" class="btn btn-ghost btn-lg">Cancelar</a>
      </div>
    </div>

  </form>

</div>

</main>

{% endblock %}
