<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAREVA – Viajes por Colombia</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/paquetes.css') }}">
</head>

<body>

<header>
  <nav class="navbar">
    <div class="container navbar__inner">

<a href="{{ url_for('inicio') }}" class="navbar__logo">
  <img src="{{ url_for('static', filename='img/logo_mareva.png') }}"
       alt="Logo MAREVA"
       class="navbar__logo-img"
       style="height: 50px; width: auto;">
  MAREVA
</a>

      <ul class="navbar__nav" id="mainNav">
        <li><a href="{{ url_for('inicio') }}" class="{% if request.path == '/'%}active{% endif %} navbar__link ">Inicio</a></li>
        <li><a href="{{ url_for('paquetes') }}" class="navbar__link {% if request.path == '/paquetes'%}active{% endif %}">Paquetes</a></li>
        <li><a href="{{ url_for('destinos') }}" class="{% if request.path == '/destinos'%}active{% endif %} navbar__link">Destinos</a></li>
        <li><a href="{{ url_for('niveles') }}" class="{% if request.path == '/destinos'%}active{% endif %} navbar__link">Niveles</a></li>
        <li><a href="{{ url_for('insignias') }}" class="{% if request.path == '/destinos'%}active{% endif %} navbar__link">Insignias</a></li>
      </ul>

<div class="navbar__actions">
  {% if session.get('usuario') %}
    <a href="{{ url_for('perfil') }}" class="btn btn-ghost btn-sm" style="display:flex;align-items:center;gap:var(--space-2)">
      <span style="width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem">👤</span>
      {{ session['usuario']['nombre'] }}
    </a>
  {% else %}
    <a href="{{ url_for('login') }}" class="btn btn-outline btn-sm">Iniciar sesión</a>
    <a href="{{ url_for('registro') }}" class="btn btn-primary btn-sm">Registrarse</a>
  {% endif %}
</div>

    </div>
  </nav>
</header>

<main>
  {% block content %}

  {% endblock %}
</main>

<footer>
  <div class="container">
    <p style="display: flex; justify-content: center; align-items: center;">© 2025 MAREVA</p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
